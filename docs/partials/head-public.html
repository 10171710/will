<script>
  /* Pre-paint: apply the saved theme and text direction before first paint
     so there is no flash of the wrong theme or the wrong side. */
  (function () {
    var theme = localStorage.getItem('wb-theme') || 'light';
    var dir = localStorage.getItem('wb-dir') || 'ltr';
    document.documentElement.classList.toggle('dark', theme === 'dark');
    document.documentElement.setAttribute('dir', dir);
    document.documentElement.setAttribute('lang', dir === 'rtl' ? 'ar' : 'en');
  })();
</script>
